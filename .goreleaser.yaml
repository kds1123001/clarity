# GoReleaser config: builds clarity for Windows/macOS/Linux, publishes a GitHub
# Release, and generates (and optionally submits) a winget manifest.
# Docs: https://goreleaser.com/customization/
version: 2
project_name: clarity

builds:
  - id: clarity
    main: .
    binary: clarity
    env:
      - CGO_ENABLED=0           # static binary, no runtime dependencies
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]

archives:
  - id: clarity
    formats: [tar.gz]
    name_template: "clarity_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]          # winget installs from the Windows .zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  github:
    owner: kds1123001
    name: clarity

# ---- winget ---------------------------------------------------------------
# Generates the manifest files. If WINGET_GITHUB_TOKEN is set, it also pushes
# them to YOUR fork of microsoft/winget-pkgs and opens a pull request.
# Without the token it only generates them (skip_upload), so first releases
# work with zero extra setup.
winget:
  - name: clarity
    publisher: kds1123001
    package_identifier: kds1123001.Clarity     # what users type: winget install kds1123001.Clarity
    short_description: Turns cryptic compiler/runtime errors into plain-English explanations.
    description: |
      Clarity wraps the output of any compiler or interpreter, points at the exact
      line, explains what went wrong in plain English, and suggests concrete fixes.
    license: MIT
    license_url: https://github.com/kds1123001/clarity/blob/main/LICENSE
    homepage: https://github.com/kds1123001/clarity
    publisher_url: https://github.com/kds1123001
    publisher_support_url: https://github.com/kds1123001/clarity/issues
    release_notes_url: https://github.com/kds1123001/clarity/releases/tag/{{ .Tag }}
    tags: [cli, compiler, errors, developer-tools, diagnostics]
    skip_upload: '{{ if .Env.WINGET_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    repository:
      owner: kds1123001
      name: winget-pkgs
      branch: "clarity-{{ .Version }}"
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
